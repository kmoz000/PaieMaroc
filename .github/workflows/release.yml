name: Version officielle signée

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  WAILS_VERSION: v2.15.0
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: Windows x64 signé
            artifact: windows-amd64
          - os: macos-15
            label: macOS universel signé et notarisé
            artifact: macos-universal
          - os: ubuntu-24.04
            label: Ubuntu/Debian x64
            artifact: linux-amd64
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        working-directory: paie-maroc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Valider la version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag invalide: $GITHUB_REF_NAME (format attendu: v1.2.3)" >&2
            exit 1
          fi

      - name: Exiger les secrets Apple
        if: runner.os == 'macOS'
        shell: bash
        run: |
          missing=0
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "Secret manquant: $name" >&2; missing=1; fi
          done
          exit "$missing"

      - name: Exiger les secrets Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $names = 'WINDOWS_CERTIFICATE_BASE64', 'WINDOWS_CERTIFICATE_PASSWORD'
          $missing = $names | Where-Object { -not (Get-Item "Env:$_" -ErrorAction SilentlyContinue).Value }
          if ($missing) { throw "Secrets manquants: $($missing -join ', ')" }

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: paie-maroc/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: paie-maroc/frontend/package-lock.json
      - name: Injecter la version dans les paquets
        run: node scripts/set-release-version.mjs
      - name: Installer les dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Installer le frontend
        run: npm ci
        working-directory: paie-maroc/frontend
      - name: Tester avant emballage
        run: go test ./...

      - name: Préparer le certificat Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'paie-maroc-authenticode.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "PAIEMAROC_CERTIFICATE_PATH=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PAIEMAROC_SIGN_SCRIPT=$env:GITHUB_WORKSPACE\paie-maroc\scripts\sign-windows.ps1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compiler et signer l'installateur Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -clean -trimpath -nsis -installscope user -o PaieMaroc.exe
          $installers = @(Get-ChildItem build/bin/*-installer.exe)
          if ($installers.Count -ne 1) { throw "Installateur NSIS introuvable ou ambigu." }
          $installer = $installers[0]
          Rename-Item $installer.FullName "PaieMaroc-$env:GITHUB_REF_NAME-Windows-x64-SIGNED-Setup.exe"
          Remove-Item build/bin/PaieMaroc.exe

      - name: Vérifier l'installateur Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem build/bin/*-SIGNED-Setup.exe)
          if ($installers.Count -ne 1) { throw "Installateur signé introuvable ou ambigu." }
          $installer = $installers[0]
          & "$env:GITHUB_WORKSPACE\paie-maroc\scripts\sign-windows.ps1" $installer.FullName -VerifyOnly
          Remove-Item $env:PAIEMAROC_CERTIFICATE_PATH -Force

      - name: Compiler macOS universel
        if: runner.os == 'macOS'
        run: wails build -clean -trimpath -platform darwin/universal -o PaieMaroc

      - name: Importer le certificat Apple
        if: runner.os == 'macOS'
        shell: bash
        run: |
          certificate="$RUNNER_TEMP/paie-maroc-developer-id.p12"
          keychain="$RUNNER_TEMP/paie-maroc.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"
          security find-identity -v -p codesigning "$keychain"
          rm -f "$certificate"

      - name: Signer, notariser et agrafer macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="build/bin/PaieMaroc.app"
          dmg="build/bin/PaieMaroc-${GITHUB_REF_NAME}-macOS-universal-SIGNED-NOTARIZED.dmg"
          notary_zip="$RUNNER_TEMP/PaieMaroc-notary.zip"
          staging="$RUNNER_TEMP/paie-maroc-dmg"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$notary_zip"
          xcrun notarytool submit "$notary_zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          mkdir -p "$staging"
          cp -R "$app" "$staging/PaieMaroc.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PaieMaroc" -srcfolder "$staging" -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          rm -rf "$app" "$staging" "$notary_zip"

      - name: Compiler Linux
        if: runner.os == 'Linux'
        run: wails build -clean -trimpath -tags webkit2_41 -o paie-maroc
      - name: Construire le paquet Debian
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="$RUNNER_TEMP/paie-maroc-package"
          mkdir -p "$package/DEBIAN" "$package/usr/bin" "$package/usr/share/applications" "$package/usr/share/icons/hicolor/512x512/apps"
          cp packaging/linux/control "$package/DEBIAN/control"
          sed -i "s/^Version:.*/Version: $version/" "$package/DEBIAN/control"
          cp build/bin/paie-maroc "$package/usr/bin/paie-maroc"
          cp packaging/linux/paie-maroc.desktop "$package/usr/share/applications/paie-maroc.desktop"
          cp build/appicon.png "$package/usr/share/icons/hicolor/512x512/apps/paie-maroc.png"
          dpkg-deb --build --root-owner-group "$package" "build/bin/PaieMaroc-${GITHUB_REF_NAME}-Linux-amd64.deb"
          dpkg-deb --info "build/bin/PaieMaroc-${GITHUB_REF_NAME}-Linux-amd64.deb"
          rm build/bin/paie-maroc

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: paie-maroc/build/bin/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publier la version
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Contrôler les paquets attendus
        shell: bash
        run: |
          shopt -s nullglob
          windows=(artifacts/*-Windows-x64-SIGNED-Setup.exe)
          macos=(artifacts/*-macOS-universal-SIGNED-NOTARIZED.dmg)
          linux=(artifacts/*-Linux-amd64.deb)
          [ "${#windows[@]}" -eq 1 ] && [ "${#macos[@]}" -eq 1 ] && [ "${#linux[@]}" -eq 1 ]
          ! find artifacts -type f -iname '*unsigned*' | grep -q .
      - name: Créer les sommes SHA-256
        run: cd artifacts && sha256sum * | sort -k2 > SHA256SUMS.txt
      - name: Attester la provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "PaieMaroc ${GITHUB_REF_NAME}"
