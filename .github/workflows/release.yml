name: Version provisoire auto-signée

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  WAILS_VERSION: v2.15.0
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: Windows x64 auto-signé
            artifact: windows-amd64
          - os: macos-15
            label: macOS universel avec signature ad hoc
            artifact: macos-universal
          - os: ubuntu-24.04
            label: Ubuntu/Debian x64
            artifact: linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: paie-maroc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Valider la version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag invalide: $GITHUB_REF_NAME (format attendu: v1.2.3)" >&2
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: paie-maroc/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: paie-maroc/frontend/package-lock.json
      - name: Injecter la version dans les paquets
        run: node scripts/set-release-version.mjs
      - name: Installer les dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Installer le frontend
        run: npm ci
        working-directory: paie-maroc/frontend
      - name: Tester le frontend
        run: npm test
        working-directory: paie-maroc/frontend
      - name: Compiler le frontend pour les tests Go embarqués
        run: npm run build
        working-directory: paie-maroc/frontend
      - name: Tester avant emballage
        run: go test ./...

      - name: Créer le certificat Windows auto-signé éphémère
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'paie-maroc-authenticode.pfx'
          $publicCertificate = Join-Path $env:RUNNER_TEMP 'paie-maroc-authenticode.cer'
          $passwordPlain = [Guid]::NewGuid().ToString('N')
          $password = ConvertTo-SecureString $passwordPlain -AsPlainText -Force
          $signer = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=PaieMaroc Provisional Release, O=PaieMaroc, C=MA' `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -NotAfter (Get-Date).AddYears(3)
          Export-PfxCertificate -Cert $signer -FilePath $certificate -Password $password | Out-Null
          Export-Certificate -Cert $signer -FilePath $publicCertificate | Out-Null
          Import-Certificate -FilePath $publicCertificate -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          "PAIEMAROC_CERTIFICATE_PATH=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PAIEMAROC_SELF_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PAIEMAROC_SELF_SIGNED_THUMBPRINT=$($signer.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDOWS_CERTIFICATE_PASSWORD=$passwordPlain" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PAIEMAROC_SIGN_SCRIPT=$env:GITHUB_WORKSPACE\paie-maroc\scripts\sign-windows.ps1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compiler et auto-signer l'installateur Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -clean -trimpath -nsis -installscope user -o PaieMaroc.exe
          $installers = @(Get-ChildItem build/bin/*-installer.exe)
          if ($installers.Count -ne 1) { throw "Installateur NSIS introuvable ou ambigu." }
          $installer = $installers[0]
          Rename-Item $installer.FullName "PaieMaroc-$env:GITHUB_REF_NAME-Windows-x64-SELF-SIGNED-Setup.exe"
          Remove-Item build/bin/PaieMaroc.exe

      - name: Vérifier l'installateur Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem build/bin/*-SELF-SIGNED-Setup.exe)
          if ($installers.Count -ne 1) { throw "Installateur auto-signé introuvable ou ambigu." }
          $installer = $installers[0]
          & "$env:GITHUB_WORKSPACE\paie-maroc\scripts\sign-windows.ps1" $installer.FullName -VerifyOnly
          Remove-Item $env:PAIEMAROC_CERTIFICATE_PATH -Force
          Remove-Item "Cert:\CurrentUser\Root\$env:PAIEMAROC_SELF_SIGNED_THUMBPRINT" -Force
          Remove-Item "Cert:\CurrentUser\My\$env:PAIEMAROC_SELF_SIGNED_THUMBPRINT" -Force

      - name: Compiler macOS universel
        if: runner.os == 'macOS'
        run: wails build -clean -trimpath -platform darwin/universal -o PaieMaroc

      - name: Auto-signer et emballer macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="build/bin/PaieMaroc.app"
          dmg="build/bin/PaieMaroc-${GITHUB_REF_NAME}-macOS-universal-SELF-SIGNED.dmg"
          staging="$RUNNER_TEMP/paie-maroc-dmg"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p "$staging"
          cp -R "$app" "$staging/PaieMaroc.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PaieMaroc" -srcfolder "$staging" -ov -format UDZO "$dmg"
          codesign --force --sign - "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          rm -rf "$app" "$staging"

      - name: Compiler Linux
        if: runner.os == 'Linux'
        run: wails build -clean -trimpath -tags webkit2_41 -o paie-maroc
      - name: Construire le paquet Debian
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="$RUNNER_TEMP/paie-maroc-package"
          mkdir -p "$package/DEBIAN" "$package/usr/bin" "$package/usr/share/applications" "$package/usr/share/icons/hicolor/512x512/apps"
          cp packaging/linux/control "$package/DEBIAN/control"
          sed -i "s/^Version:.*/Version: $version/" "$package/DEBIAN/control"
          cp build/bin/paie-maroc "$package/usr/bin/paie-maroc"
          cp packaging/linux/paie-maroc.desktop "$package/usr/share/applications/paie-maroc.desktop"
          cp build/appicon.png "$package/usr/share/icons/hicolor/512x512/apps/paie-maroc.png"
          dpkg-deb --build --root-owner-group "$package" "build/bin/PaieMaroc-${GITHUB_REF_NAME}-Linux-amd64.deb"
          dpkg-deb --info "build/bin/PaieMaroc-${GITHUB_REF_NAME}-Linux-amd64.deb"
          rm build/bin/paie-maroc

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: paie-maroc/build/bin/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publier la version
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Contrôler les paquets attendus
        shell: bash
        run: |
          shopt -s nullglob
          windows=(artifacts/*-Windows-x64-SELF-SIGNED-Setup.exe)
          macos=(artifacts/*-macOS-universal-SELF-SIGNED.dmg)
          linux=(artifacts/*-Linux-amd64.deb)
          [ "${#windows[@]}" -eq 1 ] && [ "${#macos[@]}" -eq 1 ] && [ "${#linux[@]}" -eq 1 ]
      - name: Ajouter l'avertissement de confiance
        shell: bash
        run: |
          cat > artifacts/SELF_SIGNED_NOTICE.txt <<'EOF'
          VERSION PROVISOIRE AUTO-SIGNEE

          Windows utilise un certificat Authenticode auto-signe et macOS une
          signature ad hoc. Ces signatures permettent de verifier l'integrite
          des paquets, mais elles ne sont pas reconnues par les magasins de
          confiance Microsoft et Apple. SmartScreen ou Gatekeeper peut donc
          afficher un avertissement. Verifiez SHA256SUMS.txt et l'attestation
          de provenance GitHub avant installation.
          EOF
      - name: Créer les sommes SHA-256
        run: cd artifacts && sha256sum * | sort -k2 > SHA256SUMS.txt
      - name: Attester la provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          > [!WARNING]
          > Version provisoire auto-signée. Windows SmartScreen et macOS
          > Gatekeeper peuvent afficher un avertissement. Vérifiez les sommes
          > SHA-256 et l'attestation GitHub avant installation.

          Cette release contient l'installateur Windows x64, le DMG macOS
          universel et le paquet Debian x64.
          EOF
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "PaieMaroc ${GITHUB_REF_NAME} · auto-signée"
